<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chat & VC FIX</title>
<script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
<script src="https://download.agora.io/sdk/release/AgoraRTC_N-4.20.0.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:sans-serif;background:#0f172a;color:#fff}
#login{height:100vh;display:flex;align-items:center;justify-content:center}
.card{background:#fff;color:#000;padding:20px;border-radius:12px;width:90%;max-width:320px}
input{width:100%;padding:12px;margin:8px 0;border-radius:8px;border:1px solid #ccc}
button{width:100%;padding:12px;background:#22c55e;color:#fff;border:none;border-radius:8px;font-weight:bold}
#app{display:none;height:100vh;flex-direction:column}
#msgs{flex:1;overflow-y:auto;padding:10px;background:#1e293b}
.m{margin:6px 0;padding:8px 12px;background:#334155;border-radius:10px;max-width:80%}
.me{background:#22c55e;color:#000;align-self:flex-end;margin-left:auto}
#bar{display:flex;padding:10px;background:#0f172a;gap:8px}
#txt{flex:1;padding:10px;border-radius:20px;border:none}
#videos{display:flex;gap:10px;padding:10px;background:#000}
.v{width:50%;aspect-ratio:1;background:#222;border-radius:10px}
</style>
</head>
<body>
<div id="login">
<div class="card">
<h3>Masuk Room FINAL</h3>
<input id="room" value="1" placeholder="No Room">
<input id="name" placeholder="Nama kamu">
<button onclick="masuk()">Masuk</button>
<p id="st" style="font-size:12px;color:green"></p>
</div>
</div>
<div id="app">
<div id="videos"><div id="local" class="v"></div><div id="remote" class="v"></div></div>
<div id="msgs"></div>
<div id="bar">
<input id="txt" placeholder="Ketik chat..." onkeypress="if(event.key=='Enter')kirim()">
<button onclick="kirim()" style="width:60px">Kirim</button>
<button onclick="startVC()" style="width:60px;background:#3b82f6">📹</button>
</div>
</div>
<script>
const APP_ID="648370edcd6244d7bd488f0b52edb200";
var client,roomId,userName,agoraClient,localTrack;

function masuk(){
 roomId=document.getElementById('room').value.trim()||"1";
 userName=document.getElementById('name').value.trim()||"User";
 if(!userName)return alert('Isi nama');
 document.getElementById('login').style.display='none';
 document.getElementById('app').style.display='flex';
 document.getElementById('st').innerText="Connecting MQTT...";
 client=mqtt.connect('wss://broker.hivemq.com:8884/mqtt');
 client.on('connect',()=>{
  document.getElementById('st').innerText="Connected!";
  client.subscribe('chatandvc/'+roomId);
  addMsg('System: Kamu masuk room '+roomId);
 });
 client.on('message',(t,m)=>{
  try{
   let d=JSON.parse(m.toString());
   if(d.name!=userName) addMsg(d.name+': '+d.text,false);
  }catch(e){}
 });
 client.on('error',()=>{document.getElementById('st').innerText="MQTT Error";});
}
function addMsg(t,me){
 let d=document.createElement('div');d.className='m'+(me?' me':'');d.innerText=t;
 document.getElementById('msgs').appendChild(d);
 document.getElementById('msgs').scrollTop=99999;
}
function kirim(){
 let i=document.getElementById('txt');let txt=i.value.trim();if(!txt)return;
 addMsg('Kamu: '+txt,true);
 client.publish('chatandvc/'+roomId,JSON.stringify({name:userName,text:txt}));
 i.value='';
}
async function startVC(){
 try{
  let res=await fetch('/api/rtc-token?channel='+roomId);
  let data=await res.json();
  agoraClient=AgoraRTC.createClient({mode:'rtc',codec:'vp8'});
  await agoraClient.join(APP_ID,roomId,data.token||null,0);
  localTrack=await AgoraRTC.createMicrophoneAndCameraTracks();
  localTrack[1].play(document.getElementById('local'));
  await agoraClient.publish(localTrack);
  agoraClient.on('user-published',async(u,mt)=>{
   await agoraClient.subscribe(u,mt);
   if(mt=='video')u.videoTrack.play(document.getElementById('remote'));
   if(mt=='audio')u.audioTrack.play();
  });
  alert('Video ON');
 }catch(e){alert('VC Error: '+e.message+' - tapi chat tetap jalan');}
}
</script>
</body>
</html>
