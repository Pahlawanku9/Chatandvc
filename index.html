<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Foto Bicara - Pedamaran FINAL</title>
<style>
body{background:#111;color:#fff;font-family:sans-serif;padding:15px}
.card{background:#1e1e1e;padding:15px;border-radius:12px;margin-bottom:15px}
input{width:100%;padding:10px;margin:8px 0;background:#222;color:#fff;border:1px solid #444;border-radius:8px}
button{background:#00ff88;color:#000;padding:14px;width:100%;border:none;border-radius:8px;font-weight:bold;font-size:16px}
#preview{width:100%;max-height:300px;object-fit:contain;display:none;margin-top:10px;border-radius:8px}
#resultVideo{width:100%;display:none;margin-top:15px;border-radius:12px}
</style>
</head>
<body>
<h2>🎙️ Foto Bicara Pedamaran - VERSI JADI</h2>

<div class="card">
<b>1. Token Replicate (r8_...):</b>
<input id="token" placeholder="Paste r8_.... panjang di sini">
</div>

<div class="card">
<b>2. Foto Wajah:</b>
<input type="file" id="imageInput" accept="image/*">
<img id="preview" />
</div>

<div class="card">
<b>3. Audio / Suara:</b>
<input type="file" id="audioInput" accept="audio/*">
<audio id="audioPreview" controls style="width:100%;display:none"></audio>
</div>

<div class="card">
<button id="genBtn">GENERATE VIDEO BICARA</button>
<div id="log" style="font-size:12px;color:#aaa;margin-top:10px">Siap...</div>
<video id="resultVideo" controls autoplay loop></video>
</div>

<script>
let imageDataUrl=null, audioDataUrl=null;
imageInput.onchange=e=>{
  const r=new FileReader();
  r.onload=ev=>{imageDataUrl=ev.target.result;preview.src=imageDataUrl;preview.style.display='block'}
  r.readAsDataURL(e.target.files[0])
}
audioInput.onchange=e=>{
  const r=new FileReader();
  r.onload=ev=>{audioDataUrl=ev.target.result;audioPreview.src=audioDataUrl;audioPreview.style.display='block'}
  r.readAsDataURL(e.target.files[0])
}
genBtn.onclick=async()=>{
  const token=tokenInput=document.getElementById('token').value.trim();
  const log=document.getElementById('log');
  if(!token.startsWith('r8_')){alert('Token salah! Harus r8_...');return}
  if(!imageDataUrl||!audioDataUrl){alert('Pilih foto & audio dulu');return}
  try{
    genBtn.disabled=true;
    log.textContent="Membuat prediksi...";
    let res=await fetch('https://api.replicate.com/v1/predictions',{
      method:'POST',
      headers:{'Authorization':'Token '+token,'Content-Type':'application/json'},
      body:JSON.stringify({version:'8d2d2a941daf318bb040cf7be9aebe10dfc1b52d18a490a9d9cd41e1d725a5c814',input:{face:imageDataUrl,audio:audioDataUrl}})
    });
    if(!res.ok) throw new Error(await res.text());
    let pred=await res.json();
    log.textContent="ID: "+pred.id+" - Proses AI 30-60 detik...";
    while(pred.status!=='succeeded'&&pred.status!=='failed'){
      await new Promise(r=>setTimeout(r,3000));
      let r2=await fetch('https://api.replicate.com/v1/predictions/'+pred.id,{headers:{'Authorization':'Token '+token}});
      pred=await r2.json();
      log.textContent="Status: "+pred.status+"...";
    }
    if(pred.status==='failed') throw new Error(pred.error);
    resultVideo.src=pred.output;
    resultVideo.style.display='block';
    log.textContent="SELESAI! Video jadi!";
  }catch(e){log.textContent="ERROR: "+e.message.slice(0,600)}finally{genBtn.disabled=false}
}
</script>
</body>
</html>
